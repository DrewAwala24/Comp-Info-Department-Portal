<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 – Access Denied</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary:#A04856; --primary-h:#833542; --bg:#F3F4F8; --card:#FFFFFF; --txt:#1E293B; --txt2:#475569; --border:#E2E8F0; }
        body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .icofont-svg { vertical-align: -0.16em; display: inline-block; }
        .portal-card { background:var(--card); border-radius:10px; border:1px solid var(--border); box-shadow:0 10px 25px rgba(0,0,0,.05); padding:2.5rem 2rem; max-width:460px; width:100%; text-align:center; }
        .btn-maroon { background:var(--primary); color:#fff; font-weight:600; border:none; border-radius:6px; padding:.6rem 1.25rem; text-decoration:none; }
        .btn-maroon:hover { background:var(--primary-h); color:#fff; }
        .btn-outline-maroon { border:1px solid var(--primary); color:var(--primary); font-weight:600; border-radius:6px; padding:.6rem 1.25rem; text-decoration:none; }
        .btn-outline-maroon:hover { background:var(--primary); color:#fff; }
    </style>
</head>
<body>
<div class="portal-card">
    <div class="mb-3" style="color: var(--primary); font-size: 2.5rem;">
        <th:block th:replace="~{fragments/icons :: icon('icofont-warning-alt')}" />
    </div>
    <h3 class="fw-bold mb-2" style="color: var(--primary);">403 – Access Denied</h3>
    <p class="text-secondary small mb-4">
        Your current account does not have permission to view this page.
        Admin panels require an <strong>ADMIN (HOD)</strong> account.
    </p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a th:href="@{/dashboard}" class="btn-outline-maroon">
            <th:block th:replace="~{fragments/icons :: icon('icofont-dashboard-web')}" />
            <span class="ms-1">Dashboard</span>
        </a>
        <a th:href="@{/logout}" class="btn-maroon">
            <th:block th:replace="~{fragments/icons :: icon('icofont-logout')}" />
            <span class="ms-1">Switch Account (Logout)</span>
        </a>
    </div>
</div>
</body>
</html>
