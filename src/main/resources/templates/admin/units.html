<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Panel – Units &amp; Contact Hours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary:#A04856; --primary-h:#833542; --bg:#F3F4F8; --card:#FFFFFF; --txt:#1E293B; --txt2:#475569; --border:#E2E8F0; }
        body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--txt); }
        .icofont-svg { vertical-align: -0.16em; display: inline-block; }
        .navbar-custom { background:var(--card); border-bottom:1px solid var(--border); box-shadow:0 2px 10px rgba(0,0,0,.04); }
        .navbar-brand   { color:var(--primary)!important; font-weight:700; }
        .btn-maroon     { background:var(--primary); color:#fff; font-weight:600; font-size:.85rem; border:none; border-radius:6px; padding:.5rem 1.15rem; }
        .btn-maroon:hover { background:var(--primary-h); color:#fff; }
        .btn-outline-maroon { border:1px solid var(--primary); color:var(--primary); font-weight:600; font-size:.82rem; border-radius:6px; padding:.38rem .9rem; text-decoration:none; }
        .btn-outline-maroon:hover, .btn-outline-maroon.active { background:var(--primary); color:#fff; }
        .dash-card { background:var(--card); border-radius:10px; border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.05); margin-bottom:2rem; overflow:hidden; }
        .dash-card-header { background:var(--card); border-bottom:1px solid var(--border); padding:1.1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem; }
        .dash-card-title { color:var(--primary); font-weight:700; font-size:1.05rem; margin:0; }
        .badge-code { background:#F8FAFC; color:var(--primary); border:1px solid var(--border); font-weight:600; font-size:.78rem; padding:.3rem .6rem; border-radius:4px; }
        th { font-weight:600; font-size:.78rem; color:var(--txt2); text-transform:uppercase; letter-spacing:.5px; }
        .form-control:focus, .form-select:focus { border-color:var(--primary); box-shadow:0 0 0 .2rem rgba(160,72,86,.15); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <th:block th:replace="~{fragments/icons :: icon('icofont-education')}" />
            <span class="ms-1">Kitale Polytechnic · Comp &amp; Info</span>
        </a>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <a th:href="@{/dashboard}" class="btn-outline-maroon"><th:block th:replace="~{fragments/icons :: icon('icofont-dashboard-web')}" /> <span class="ms-1">Dashboard</span></a>
            <a th:href="@{/admin/courses}" class="btn-outline-maroon"><th:block th:replace="~{fragments/icons :: icon('icofont-book-alt')}" /> <span class="ms-1">Programs</span></a>
            <a th:href="@{/admin/units}" class="btn-outline-maroon active"><th:block th:replace="~{fragments/icons :: icon('icofont-layers')}" /> <span class="ms-1">Units</span></a>
            <a th:href="@{/admin/users}" class="btn-outline-maroon"><th:block th:replace="~{fragments/icons :: icon('icofont-users-alt-5')}" /> <span class="ms-1">Users</span></a>
            <a th:href="@{/logout}" class="btn-outline-maroon"><th:block th:replace="~{fragments/icons :: icon('icofont-logout')}" /> <span class="ms-1">Logout</span></a>
        </div>
    </div>
</nav>

<div class="container mb-5">

    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <th:block th:replace="~{fragments/icons :: icon('icofont-check-circled')}" /> <span class="ms-1" th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <th:block th:replace="~{fragments/icons :: icon('icofont-warning-alt')}" /> <span class="ms-1" th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="dash-card">
        <div class="dash-card-header">
            <h3 class="dash-card-title"><th:block th:replace="~{fragments/icons :: icon('icofont-plus-circle')}" /> <span class="ms-1">Add Unit / Module</span></h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/units}" th:object="${newUnit}" method="post">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label fw-semibold small">Unit Code</label>
                        <input type="text" th:field="*{unitCode}" class="form-control" placeholder="DCS 2405" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold small">Unit Title</label>
                        <input type="text" th:field="*{unitName}" class="form-control" placeholder="Object Oriented Programming" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small">Program / Course</label>
                        <select name="courseId" class="form-select" required>
                            <option th:each="c : ${courses}" th:value="${c.id}"
                                    th:text="${c.courseCode + ' – ' + c.courseName}"
                                    th:selected="${selectedCourseId == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold small">Assigned Lecturer</label>
                        <select name="lecturerId" class="form-select">
                            <option value="">— Unassigned —</option>
                            <option th:each="l : ${lecturers}" th:value="${l.id}" th:text="${l.fullName}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold small">Theory Hours</label>
                        <input type="number" th:field="*{theoryHours}" class="form-control" min="0" value="30" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold small">Practical / Lab Hrs</label>
                        <input type="number" th:field="*{practicalHours}" class="form-control" min="0" value="30" required>
                    </div>
                    <div class="col-md-8 d-flex align-items-end">
                        <button type="submit" class="btn btn-maroon"><th:block th:replace="~{fragments/icons :: icon('icofont-save')}" /> <span class="ms-1">Add Unit</span></button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="dash-card">
        <div class="dash-card-header">
            <h3 class="dash-card-title"><th:block th:replace="~{fragments/icons :: icon('icofont-layers')}" /> <span class="ms-1">Curriculum Units</span></h3>
            <form method="get" th:action="@{/admin/units}" class="d-flex gap-2">
                <select name="courseId" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option value="">All Programs</option>
                    <option th:each="c : ${courses}" th:value="${c.id}"
                            th:text="${c.courseCode + ' – ' + c.courseName}"
                            th:selected="${selectedCourseId == c.id}"></option>
                </select>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Unit Code</th>
                    <th>Unit Name</th>
                    <th>Program</th>
                    <th>Lecturer</th>
                    <th>Theory</th>
                    <th>Practical</th>
                    <th>Total</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(units)}">
                    <td colspan="8" class="text-center py-4 text-secondary">No units found.</td>
                </tr>
                <tr th:each="u : ${units}">
                    <td><span class="badge-code" th:text="${u.unitCode}">DCS 2401</span></td>
                    <td class="fw-semibold" th:text="${u.unitName}">Unit Name</td>
                    <td><span class="badge bg-light text-dark border" th:text="${u.course.courseCode}">DCS241</span></td>
                    <td th:text="${u.lecturer != null ? u.lecturer.fullName : 'Unassigned'}">Lecturer</td>
                    <td th:text="${u.theoryHours + ' hrs'}">30 hrs</td>
                    <td th:text="${u.practicalHours + ' hrs'}">30 hrs</td>
                    <td class="fw-semibold" th:text="${u.totalHours + ' hrs'}">60 hrs</td>
                    <td class="text-end">
                        <form th:action="@{'/admin/units/' + ${u.id} + '/delete'}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this unit?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                <th:block th:replace="~{fragments/icons :: icon('icofont-trash')}" />
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
