<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Portal – Announcements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary:#A04856; --primary-h:#833542; --bg:#F3F4F8; --card:#FFFFFF; --txt:#1E293B; --txt2:#475569; --border:#E2E8F0; }
        body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--txt); }
        .icofont-svg { vertical-align: -0.16em; display: inline-block; }
        .navbar-custom { background:var(--card); border-bottom:1px solid var(--border); box-shadow:0 2px 10px rgba(0,0,0,.04); }
        .navbar-brand   { color:var(--primary)!important; font-weight:700; }
        .btn-maroon     { background:var(--primary); color:#fff; font-weight:600; border:none; border-radius:6px; padding:.5rem 1.25rem; transition:background .2s; }
        .btn-maroon:hover { background:var(--primary-h); color:#fff; }
        .btn-outline-maroon { border:1px solid var(--primary); color:var(--primary); font-weight:600; border-radius:6px; padding:.4rem 1rem; text-decoration:none; transition:all .2s; }
        .btn-outline-maroon:hover { background:var(--primary); color:#fff; }
        .dash-card { background:var(--card); border-radius:10px; border:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.05); margin-bottom:2rem; overflow:hidden; }
        .dash-card-header { background:var(--card); border-bottom:1px solid var(--border); padding:1.1rem 1.5rem; }
        .dash-card-title  { color:var(--primary); font-weight:700; font-size:1.05rem; margin:0; }
        .ann-item  { border-left:4px solid var(--primary); background:#FAFAFC; padding:1.1rem 1.25rem; border-radius:0 8px 8px 0; margin-bottom:1rem; }
        .ann-meta  { font-size:.78rem; color:var(--txt2); margin-top:.4rem; }
        .badge-code   { background:#F8FAFC; color:var(--primary); border:1px solid var(--border); font-weight:600; font-size:.78rem; padding:.3rem .6rem; border-radius:4px; }
        .badge-global { background:#22c55e; color:#fff; font-weight:600; font-size:.72rem; padding:.2rem .5rem; border-radius:4px; }
        .form-control:focus, .form-select:focus { border-color:var(--primary); box-shadow:0 0 0 .25rem rgba(160,72,86,.15); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom mb-5">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <th:block th:replace="~{fragments/icons :: icon('icofont-education')}" />
            <span class="ms-1">Department Portal</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/dashboard}" class="btn-outline-maroon">
                <th:block th:replace="~{fragments/icons :: icon('icofont-dashboard-web')}" />
                <span class="ms-1">Dashboard</span>
            </a>
            <span class="text-secondary fw-semibold" style="font-size:.88rem;" th:text="${#authentication.name}">Username</span>
            <a th:href="@{/logout}" class="btn btn-outline-maroon">
                <th:block th:replace="~{fragments/icons :: icon('icofont-logout')}" />
                <span class="ms-1">Logout</span>
            </a>
        </div>
    </div>
</nav>

<div class="container mb-5">

    <div th:if="${param.created}" class="alert alert-success alert-dismissible fade show" role="alert">
        <th:block th:replace="~{fragments/icons :: icon('icofont-check-circled')}" />
        <span class="ms-1">Announcement published and email notifications dispatched!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div sec:authorize="hasAnyRole('ADMIN', 'LECTURER')" class="dash-card">
        <div class="dash-card-header">
            <h3 class="dash-card-title">
                <th:block th:replace="~{fragments/icons :: icon('icofont-bullhorn')}" />
                <span class="ms-2">Publish New Announcement</span>
            </h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/announcements}" th:object="${newAnnouncement}" method="post">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Title</label>
                        <input type="text" th:field="*{title}" class="form-control" placeholder="Enter title…" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Target Audience</label>
                        <select name="targetCourseId" class="form-select">
                            <option value="">— Broadcast to ALL (Global) —</option>
                            <option th:each="c : ${courses}"
                                    th:value="${c.id}"
                                    th:text="${c.courseCode + ' – ' + c.courseName}">
                            </option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Content</label>
                        <textarea th:field="*{content}" class="form-control" rows="4" placeholder="Write details here…" required></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-maroon">
                            <th:block th:replace="~{fragments/icons :: icon('icofont-paper-plane')}" />
                            <span class="ms-1">Publish &amp; Send Emails</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="dash-card">
        <div class="dash-card-header">
            <h3 class="dash-card-title">
                <th:block th:replace="~{fragments/icons :: icon('icofont-notification')}" />
                <span class="ms-2">Recent Announcements</span>
            </h3>
        </div>
        <div class="card-body p-4">
            <div th:if="${#lists.isEmpty(announcements)}" class="text-center py-4 text-secondary">
                <th:block th:replace="~{fragments/icons :: icon('icofont-notification')}" />
                <p class="mt-2">No announcements posted yet.</p>
            </div>
            <div th:each="a : ${announcements}" class="ann-item">
                <div class="d-flex justify-content-between align-items-start mb-1">
                    <h6 class="fw-bold mb-0" th:text="${a.title}">Title</h6>
                    <div class="d-flex gap-2 align-items-center">
                        <span th:if="${a.targetCourse == null}" class="badge-global">Global</span>
                        <span th:if="${a.targetCourse != null}" class="badge-code" th:text="${a.targetCourse.courseCode}">DCS241</span>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{'/announcements/' + ${a.id} + '/delete'}"
                              method="post" class="mb-0"
                              onsubmit="return confirm('Delete this announcement?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger py-0 px-2" title="Delete">
                                <th:block th:replace="~{fragments/icons :: icon('icofont-trash')}" />
                            </button>
                        </form>
                    </div>
                </div>
                <p class="mb-1 small" th:text="${a.content}">Content…</p>
                <div class="ann-meta">
                    <th:block th:replace="~{fragments/icons :: icon('icofont-clock-time')}" />
                    <span th:text="${#temporals.format(a.createdAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026</span>
                    <span th:if="${a.author != null}"> ·
                        <th:block th:replace="~{fragments/icons :: icon('icofont-user-alt-3')}" />
                        <span th:text="${a.author.fullName}">Author</span>
                    </span>
                    <span th:if="${a.targetCourse != null}"> ·
                        <th:block th:replace="~{fragments/icons :: icon('icofont-book-alt')}" />
                        <span th:text="${a.targetCourse.courseName}">Course</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
