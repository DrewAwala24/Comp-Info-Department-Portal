<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Department Announcements</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 100px; }
        button { background-color: #A04856; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #833542; }
        .announcement-card { background: #fafafa; border-left: 4px solid #A04856; padding: 15px; margin-bottom: 15px; border-radius: 0 4px 4px 0; }
        .badge { display: inline-block; padding: 3px 8px; background: #28a745; color: white; border-radius: 3px; font-size: 12px; }
        .meta { font-size: 12px; color: #777; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Department Announcements Bulletin</h2>

    <!-- Form visible ONLY to ADMIN and LECTURER -->
    <div sec:authorize="hasAnyRole('ADMIN', 'LECTURER')">
        <h3>Publish New Announcement</h3>
        <form th:action="@{/announcements}" th:object="${newAnnouncement}" method="post">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" th:field="*{title}" required placeholder="Enter title..." />
            </div>

            <div class="form-group">
                <label for="content">Content:</label>
                <textarea id="content" th:field="*{content}" required placeholder="Write details here..."></textarea>
            </div>

            <div class="form-group">
                <label for="targetCourse">Target Audience:</label>
                <select id="targetCourse" th:field="*{targetCourse}">
                    <option value="">-- Broadcast to ALL Students (Global) --</option>
                    <option th:each="course : ${courses}"
                            th:value="${course.id}"
                            th:text="${course.courseCode + ' - ' + course.courseName}">
                    </option>
                </select>
            </div>

            <button type="submit">Publish & Send Emails</button>
        </form>
        <hr style="margin: 30px 0;" />
    </div>

    <!-- Feed View -->
    <h3>Recent Announcements</h3>
    <div th:if="${#lists.isEmpty(announcements)}">
        <p>No announcements posted yet.</p>
    </div>

    <div th:each="announcement : ${announcements}" class="announcement-card">
        <h4 style="margin: 0 0 5px 0;">
            <span th:text="${announcement.title}">Title</span>
            <span th:if="${announcement.targetCourse == null}" class="badge">Global</span>
        </h4>
        <p th:text="${announcement.content}" style="margin: 5px 0;">Content</p>
        <div class="meta">
            Target Course:
            <strong th:text="${announcement.targetCourse != null ? announcement.targetCourse.courseCode : 'All Courses'}">All</strong> |
            Posted on: <span th:text="${#temporals.format(announcement.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
        </div>
    </div>
</div>

</body>
</html>
