<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Portal - Login</title>
    <!-- Montserrat Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-maroon: #A04856;
            --primary-hover: #833542;
            --bg-canvas: #F3F4F8;
            --surface-card: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-card {
            background-color: var(--surface-card);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }

        .portal-title {
            color: var(--primary-maroon);
            font-weight: 700;
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .portal-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .form-label {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .form-control {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .form-control:focus {
            border-color: var(--primary-maroon);
            box-shadow: 0 0 0 0.25rem rgba(160, 72, 86, 0.15);
        }

        .btn-maroon {
            background-color: var(--primary-maroon);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.75rem;
            border-radius: 6px;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-maroon:hover, .btn-maroon:focus {
            background-color: var(--primary-hover);
            color: #FFFFFF;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            text-align: center;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="portal-card">
    <h2 class="portal-title">Department Portal</h2>
    <p class="portal-subtitle">Please enter your credentials to log in</p>

    <div th:if="${param.error}" class="alert alert-danger text-center py-2 fs-6">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-info text-center py-2 fs-6">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username / Email</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-maroon w-100">Sign In</button>
    </form>

    <div class="footer-text">
        Department Management System &copy; 2026
    </div>
</div>

</body>
</html>
